# Pre-commit hooks for code quality
# Install: pre-commit install  (sets up both the pre-commit and commit-msg hooks)
# Run manually: pre-commit run --all-files
# Run manually (commit-msg only): pre-commit run --hook-stage commit-msg --commit-msg-filename <file>

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        exclude: \.fake\.json$
        stages: [pre-commit]

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: [--ignore-missing-imports]
        exclude: ^(migrations|tests)/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit + integration)
        entry: bash -c "uv run pytest -m 'not e2e' -q"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Barreira contra segredo no GitHub: os repositórios são públicos. O mesmo bloqueio roda no CI
  # (.github/workflows/segredos.yml), para valer também quando o hook local é pulado.
  - repo: local
    hooks:
      - id: arquivo-secreto
        name: bloqueia arquivo de segredo (chave, dump, .env, tfstate)
        language: fail
        entry: >-
          Arquivo de segredo não vai para o GitHub (repositório público). Tire do commit e
          deixe fora do git. Backups, chaves e .env ficam só na VM e em ~/buska-backups.
        files: >-
          (?x)(^|/)(
          \.env(\..*)?
          |.*\.(keystore|jks|p12|pfx|pem|dump|pass|tfstate|tfvars)
          |terraform\.tfstate(\.backup)?
          |clouds\.yaml
          |.*service-account.*\.json
          |id_(rsa|ed25519).*
          )$
        exclude: >-
          (?x)(^|/)(
          \.env\.example
          |env\.demo\.example
          |debug\.keystore
          |.*\.fake\.json
          )$
      - id: segredo-no-conteudo
        name: bloqueia credencial colada no código
        language: pygrep
        entry: >-
          (?x)(
          application_credential_secret\s*[:=]\s*\S{16,}
          |gh[pousr]_[A-Za-z0-9]{30,}
          |github_pat_[A-Za-z0-9_]{30,}
          |AKIA[0-9A-Z]{16}
          |xox[baprs]-[A-Za-z0-9-]{20,}
          |(postgres(ql)?|mysql|mongodb)://[^\s:/@]+:[^\s@]{6,}@
          |JWT_SECRET_KEY\s*=\s*[A-Za-z0-9+/_=\-]{24,}
          )
        types: [text]
        # Modelos e README trazem valores de exemplo, como JWT_SECRET_KEY=troque-por-um-valor.
        exclude: ^(\.pre-commit-config\.yaml|\.github/workflows/segredos\.yml|uv\.lock|README\.md|.*\.example)$

