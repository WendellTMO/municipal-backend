# Trecho do server HTTPS de buska.lsd.ufcg.edu.br (certificado Let's Encrypt já existente).
# Mantenha o location /landing-page/ que já existe e acrescente estes.
# O build web (npm run build:web no front) vai para /var/www/buska-app.
# O mesmo diretório recebe buska.apk e app-version.json (build-apk-demo.sh); o JSON e o APK não podem ser cacheados.

# API, mesma origem do app web, então o navegador não precisa de CORS nem de HTTP puro
location /v1/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# APK sempre revalidado: sem isso o Chrome pode reutilizar um APK velho depois de uma nova publicação
location = /buska.apk {
    root /var/www/buska-app;
    add_header Cache-Control "no-cache";
}

# Manifesto de versão do app Android, sempre revalidado
location = /app-version.json {
    root /var/www/buska-app;
    add_header Cache-Control "no-cache";
}

# Termos de uso: página estática só com o texto, sem o app em volta (termos-de-uso.html, publicado
# junto com o site por publicar-web-demo.sh)
location = /termos-de-uso {
    root /var/www/buska-app;
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /termos-de-uso.html =404;
}

# Bundle com hash no nome (main.1a2b3c4d.js): o conteúdo nunca muda sob o mesmo nome, então o navegador
# guarda por um ano e nem pergunta ao servidor. Uma publicação nova troca o nome, e o index.html (abaixo)
# é revalidado a cada abertura, então o site novo aparece sem recarga forçada.
location ~ "^/[^/]+\.[0-9a-f]{8}\.js(\.LICENSE\.txt)?$" {
    root /var/www/buska-app;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Fontes e imagens do app: um dia de cache, para não pedir de novo a cada abertura
location ~ ^/(fonts|images)/ {
    root /var/www/buska-app;
    add_header Cache-Control "public, max-age=86400";
}

# App web com fallback para as rotas do React (por exemplo /convite/<token>).
# no-cache faz o navegador perguntar ao servidor a cada abertura (resposta 304 se nada mudou).
# Sem isso ele reaproveita o bundle.js antigo por horas e o site novo não aparece.
location / {
    root /var/www/buska-app;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
