# Trecho do server HTTPS de buska.lsd.ufcg.edu.br (certificado Let's Encrypt já existente).
# Mantenha o location /landing-page/ que já existe e acrescente estes.
# O build web (npm run build:web no front) vai para /var/www/buska-app.

# API, mesma origem do app web, então o navegador não precisa de CORS nem de HTTP puro
location /v1/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# App web com fallback para as rotas do React (por exemplo /convite/<token>)
location / {
    root /var/www/buska-app;
    try_files $uri /index.html;
}
