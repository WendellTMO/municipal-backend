tags:
  - Users
summary: Trocar a senha de quem está logado
description: |
  **POST** `/v1/users/change-password`. Exige o token do usuário (`Authorization: Bearer`).

  Corpo JSON: `{"current_password", "new_password", "confirm_password"}` (a confirmação é opcional; se vier, precisa ser igual).

  Regras da senha nova (modelo do NIST SP 800-63B):
  - De 8 a 128 caracteres, sem exigir maiúscula ou símbolo.
  - Diferente da atual e igual à confirmação.
  - Fora da lista de senhas comuns, sem o e-mail do usuário e fora de vazamentos públicos
    (consulta k-anonymity ao Have I Been Pwned; só 5 caracteres do SHA-1 saem do servidor, e se o
    serviço não responde a troca segue).

  Proteções:
  - A senha atual é obrigatória. 5 erros seguidos travam a troca por 15 minutos (429).
  - As outras sessões deixam de valer (`TOKEN_REVOKED`). A resposta traz um `token` novo para o
    aparelho que trocou a senha continuar logado.
  - Links de recuperação pendentes são apagados.
  - O dono recebe notificação no app e e-mail avisando da troca.

  `POST /v1/auth/reset-password` também derruba as sessões abertas.

  Erros: 400 senha atual errada, senhas diferentes ou senha fraca; 401 sem login; 429 troca travada.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
responses:
  200:
    description: Senha alterada; devolve `message` e um `token` novo.
