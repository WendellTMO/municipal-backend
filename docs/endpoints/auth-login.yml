---
tags:
  - Authentication
summary: User Login
description: |
  Authenticates a user with email and password, returning an access JWT token and user details.

  Brute-force protection: per email (existing or not), the 4 first consecutive failures do not lock.
  The 5th locks for 30 s and each new failure doubles the wait (60 s, 2 min, 4 min, 8 min) up to
  15 min. While locked, even the right password gets 429, and attempts made during the lock do not
  count. A successful login or a password reset clears the counter.
operationId: authLogin
parameters:
  - in: body
    name: body
    required: true
    description: JSON containing user credentials.
    schema:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@buska.app
          description: The user's email address.
        password:
          type: string
          format: password
          example: senha123
          description: The user's password.
responses:
  200:
    description: Login successful. Returns JWT access token.
    schema:
      type: object
      properties:
        access_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            nome:
              type: string
            role:
              type: string
  400:
    description: Bad Request. Missing email or password, or invalid format.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Email and password are required
  401:
    description: Unauthorized. Invalid credentials.
    schema:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials
  404:
    description: User not found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: User not found
  429:
    description: Too many failed attempts for this email. The message says how long to wait.
