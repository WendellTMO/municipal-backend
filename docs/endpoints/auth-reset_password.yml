tags:
  - Auth
summary: Redefinir a senha com o token do e-mail
description: |
  **POST** `/v1/auth/reset-password`. Chamado pela tela `/redefinir-senha/<token>` do app e do
  site. O link do e-mail de recuperação (`POST /v1/auth/forgot-password`) aponta para essa tela,
  no endereço público `FRONTEND_URL`. O token vale 1 hora e é de uso único.

  Corpo JSON: `{"token", "new_password", "confirm_password"}`. A senha precisa ter pelo menos 8
  caracteres e as duas senhas precisam ser iguais.

  A API não serve mais página HTML: `GET /v1/auth/reset-password` responde 405.

  Erros: 400 token ausente, inválido ou expirado, senhas diferentes ou senha fraca.
security: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [token, new_password, confirm_password]
      properties:
        token:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
responses:
  200:
    description: Senha redefinida
